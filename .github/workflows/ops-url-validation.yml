name: OPS URL validation

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
    paths:
      - 'api/**'
      - 'server/**'
      - 'scripts/test-ops-url-001.mjs'
      - 'docs/releases/OPS-URL-001-WHATWG-REQUEST-QUERY.md'
      - '.github/workflows/ops-url-validation.yml'

permissions:
  contents: read

concurrency:
  group: ops-url-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate OPS-URL-001 contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          show-progress: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate WHATWG request query boundary
        run: node --experimental-strip-types scripts/test-ops-url-001.mjs

  final-aegis:
    name: Final AEGIS integration gate
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify exact PR diff whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: Run mandatory AEGIS integration gate
        run: npm run check
