name: VIP Data validation

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches:
      - main
    paths:
      - 'public/data/vip/**'
      - 'server/data-engine/source-assets/vip/**'
      - 'scripts/test-vip-001a.mjs'
      - 'docs/releases/VIP-001A-VIP-PROGRESSION-FOUNDATION.md'
      - '.github/workflows/vip-data-validation.yml'

permissions:
  contents: read

concurrency:
  group: vip-data-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate VIP-001A governed data contract
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          show-progress: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate VIP-001A contract
        run: node scripts/test-vip-001a.mjs

  final-aegis:
    name: Final AEGIS integration gate
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          show-progress: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify exact PR diff whitespace
        run: git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: Run mandatory AEGIS integration gate
        run: npm run check
