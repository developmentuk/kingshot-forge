name: MIGHTPULSE-001C Alliance Intelligence validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'server/mightpulse/**'
      - 'server/alliance-intelligence/**'
      - 'server/player-identity/providers/mightPulsePlayerProvider.ts'
      - 'scripts/test-mightpulse-alliance-provider.mjs'
      - 'scripts/test-mightpulse-alliance-persistence.mjs'
      - 'scripts/test-mightpulse-alliance-persistence-postgres.mjs'
      - 'supabase/migrations/20260831150000_mightpulse_001c_b_alliance_persistence.sql'
      - 'scripts/test-mightpulse-player-provider.mjs'
      - 'docs/releases/MIGHTPULSE-001C-ALLIANCE-INTELLIGENCE.md'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: mightpulse-001c-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Alliance provider contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test Alliance provider
        run: npm run test:mightpulse-alliance-provider

      - name: Test Alliance persistence
        run: npm run test:mightpulse-alliance-persistence

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Test Alliance persistence against disposable PostgreSQL
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
        run: node scripts/test-mightpulse-alliance-persistence-postgres.mjs

      - name: Test Player provider regression
        run: node --import tsx scripts/test-mightpulse-player-provider.mjs

      - name: Validate NodeNext imports
        run: npm run validate:nodenext

      - name: Build candidate
        run: npm run build
