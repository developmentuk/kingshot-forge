name: Island Route lockfile refresh

on:
  push:
    branches:
      - feature/island-route-optimizer
  pull_request:
    branches:
      - feature/island-route-optimizer

permissions:
  contents: write

concurrency:
  group: island-route-lockfile-refresh
  cancel-in-progress: true

jobs:
  refresh-lockfile:
    if: github.event_name == 'pull_request' || github.event.head_commit.message != 'chore(island-route): regenerate package lock'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/island-route-optimizer
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Regenerate package lock only
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(island-route): regenerate package lock"
          git push origin HEAD:feature/island-route-optimizer
