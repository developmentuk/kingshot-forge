name: Sentry dependency bootstrap

on:
  push:
    branches:
      - feature/sentry-observability-001
    paths:
      - .github/workflows/sentry-bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    name: Generate Sentry dependency lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: feature/sentry-observability-001
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Sentry runtime SDKs
        run: npm install --save-exact @sentry/react@10.68.0 @sentry/node@10.68.0

      - name: Install Sentry Vite plugin
        run: npm install --save-dev --save-exact @sentry/vite-plugin@5.4.0

      - name: Commit generated dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency files are already current."
            exit 0
          fi
          git commit -m "chore(observability): add Sentry dependencies"
          git push origin HEAD:feature/sentry-observability-001
