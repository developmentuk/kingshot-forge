name: Sentry dependency bootstrap

on:
  push:
    branches:
      - feature/sentry-observability-001
    paths:
      - .github/workflows/sentry-bootstrap.yml

permissions:
  contents: write

jobs:
  bootstrap:
    name: Generate Sentry dependency lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out integration branch
        uses: actions/checkout@v4
        with:
          ref: feature/sentry-observability-001
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install Sentry runtime SDKs
        run: npm install --save-exact @sentry/react@10.68.0 @sentry/node@10.68.0

      - name: Install Sentry Vite plugin
        run: npm install --save-dev --save-exact @sentry/vite-plugin@5.4.0

      - name: Register the observability contract test
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'
          const packageJson = JSON.parse(readFileSync('package.json', 'utf8'))
          packageJson.scripts['test:observability'] = 'node scripts/test-sentry-observability.mjs'
          const anchor = 'npm run test:companion-admin-stage-1a && npm run test:workspaces'
          const replacement = 'npm run test:companion-admin-stage-1a && npm run test:observability && npm run test:workspaces'
          if (!packageJson.scripts.check.includes('npm run test:observability')) {
            if (!packageJson.scripts.check.includes(anchor)) throw new Error('Unable to locate the check-script insertion point.')
            packageJson.scripts.check = packageJson.scripts.check.replace(anchor, replacement)
          }
          writeFileSync('package.json', `${JSON.stringify(packageJson, null, 2)}\n`)
          NODE

      - name: Commit generated dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency files are already current."
            exit 0
          fi
          git commit -m "chore(observability): register Sentry validation"
          git push origin HEAD:feature/sentry-observability-001
