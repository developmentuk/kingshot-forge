name: Island Route validation

on:
  push:
    branches:
      - feature/island-route-optimizer
    paths:
      - '.github/workflows/island-route-validation.yml'
      - 'src/features/island-route-optimizer/**'
      - 'scripts/test-island-route-optimizer.mjs'
      - 'src/App.tsx'
      - 'src/navigation/workspaceRegistry.ts'
      - 'src/pages/HomePage.tsx'
      - 'package.json'
  pull_request:
    paths:
      - 'src/features/island-route-optimizer/**'
      - 'scripts/test-island-route-optimizer.mjs'
      - 'src/App.tsx'
      - 'src/navigation/workspaceRegistry.ts'
      - 'src/pages/HomePage.tsx'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: island-route-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify Island route engine
        run: npm run test:island-route

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
