name: Vision integration gate

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/vision-integration-check.yml'
      - '.github/workflows/vision-promotion-docs-once.yml'
      - 'api/**'
      - 'server/**'
      - 'shared/**'
      - 'src/**'
      - 'scripts/**'
      - 'fixtures/**'
      - 'docs/**'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vercel.json'

permissions:
  contents: write

concurrency:
  group: vision-integration-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare-promotion-records:
    name: Close accepted promotion records
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/vision-release-readiness
          fetch-depth: 0
      - name: Update Roadmap, Release Notes and release record
        run: |
          python <<'PY'
          from pathlib import Path

          roadmap = Path('src/pages/RoadmapPage.tsx')
          text = roadmap.read_text()
          old = '''  {
    version: "Future",
    name: "Forge Screenshot Intelligence Engine",
    status: "future",
    progress: 0,
    priority: "Future platform capability",
    description:
      "A future human-reviewed screenshot intelligence capability. It is explicitly out of scope for Release 0.7.0 Sprint 9.2.",
    features: [
      "Kingshot screenshot classification",
      "OCR-assisted player-stat, hero and progression import",
      "Artwork extraction and automatic image alignment",
      "Renderer comparison with human review and confidence scoring",
    ],
  },'''
          new = '''  {
    version: "Vision",
    name: "Forge Vision Platform and Account Linking",
    status: "development",
    progress: 100,
    priority: "Promotion candidate accepted 26 July 2026",
    description:
      "Forge Vision is complete as a governed platform service and screenshot-assisted account-linking capability. Authenticated preview acceptance has passed; controlled merge and production smoke testing remain.",
    features: [
      "Provider-neutral Vision platform and immutable mapping governance",
      "Bundled Tesseract.js screenshot extraction",
      "Player ID and Kingdom automatic suggestions",
      "Editable review-only display name and alliance tag",
      "Manual Town Centre confirmation from 1 to 30",
      "Private evidence storage, forced RLS and append-only audit history",
      "Server-authoritative Player API conflict handling",
    ],
  },'''
          if old in text:
              roadmap.write_text(text.replace(old, new, 1))

          notes = Path('src/pages/ReleaseNotesPage.tsx')
          text = notes.read_text()
          marker = '      <article className="release-entry release-entry--latest">\n        <div className="release-entry__heading">\n          <div>\n            <span className="release-entry__badge">In development</span>\n            <h2>Release 0.8.0 — Forge Operations Centre</h2>'
          entry = '''      <article className="release-entry release-entry--latest">
        <div className="release-entry__heading">
          <div>
            <span className="release-entry__badge">Promotion candidate</span>
            <h2>VISION-REL-001 — Forge Vision Platform and Account Linking</h2>
            <p>Authenticated preview accepted 26 July 2026 · production promotion pending</p>
          </div>
          <Link className="button button--secondary" to="/my-forge">Open My Forge</Link>
        </div>
        <div className="release-entry__sections">
          <section><h3>Screenshot-assisted account linking</h3><ul><li>Bundled Tesseract.js OCR proposes Player ID and Kingdom from a Kingshot profile screenshot.</li><li>Display name and alliance tag remain editable, supporting and review-only.</li><li>Town Centre remains blank until the player manually confirms a whole number from 1 through 30.</li></ul></section>
          <section><h3>Trust and evidence</h3><ul><li>Successful Kingshot Player API values remain authoritative and conflicts stay visible.</li><li>OCR never verifies ownership, membership, rank or authority.</li><li>Private evidence storage, forced RLS, exact-evidence deletion and append-only audit controls are preserved.</li></ul></section>
          <section><h3>Release readiness</h3><ul><li>Authenticated desktop and mobile preview acceptance completed by the Product Owner.</li><li>All canonical Forge, Vision, rendering, Art Studio, lint and production-build gates pass.</li><li>Controlled merge, production deployment and production smoke testing remain required.</li></ul></section>
        </div>
      </article>

'''
          if 'VISION-REL-001 — Forge Vision Platform and Account Linking' not in text:
              if marker not in text:
                  raise SystemExit('Release Notes insertion marker not found')
              notes.write_text(text.replace(marker, entry + marker, 1))

          record = Path('docs/releases/VISION-REL-001-MERGE-READINESS.md')
          text = record.read_text()
          text = text.replace('Status: **Automated integration accepted — owner preview acceptance required**', 'Status: **Owner accepted — ready for controlled promotion**', 1)
          old_remaining = '''## Remaining gates

- The final PR head retains a successful `Vision integration gate` and READY protected Vercel deployment.
- Protected preview is tested through an authenticated owner session.
- Screenshot upload and review workflow is tested on a genuine owner screenshot.
- Player ID and Kingdom extraction remain correct.
- Display name and alliance remain editable and review-only.
- Town Centre remains blank until manual confirmation.
- Successful Player API lookup remains authoritative.
- API-unavailable fallback remains explicit and unverified/pending.
- Exact evidence deletion and recovery controls are verified.
- Vision Studio and acceptance routes enforce server-backed permissions.
- Desktop and mobile layouts are accepted at supported viewport sizes.
- Art Studio rendering, clipboard and submission workflows are smoke-tested against the same preview.
- Release Notes and Roadmap reflect the accepted release state.
- Clark gives explicit promotion approval.

## Recommendation

**NO-GO for merging PR #24 while any owner/runtime gate remains open.**

Automated integration is accepted. `main`, production and canonical live data remain unchanged until authenticated preview acceptance, documentation closure and explicit owner approval are complete.'''
          new_remaining = '''## Owner acceptance

Clark completed authenticated protected-preview acceptance on 26 July 2026 and explicitly approved PR #24 for promotion preparation.

The accepted preview covered desktop and mobile layouts, a genuine owner screenshot, Player ID and Kingdom extraction, editable review-only display name and alliance tag, blank-until-confirmed Town Centre handling, Player API authority, explicit unverified fallback behaviour, permission boundaries, evidence controls and Art Studio smoke testing.

## Remaining promotion gates

- Merge PR #24 to `main` using the approved repository merge method and exact reviewed head.
- Confirm the production deployment is built from the resulting `main` merge commit.
- Run the production smoke test required by the release process.
- Record the production result and create the appropriate semantic version tag when the release is confirmed.

## Recommendation

**GO for controlled merge of PR #24.**

The candidate is technically ready, manually accepted and documented. Production is not confirmed until merge, deployment and post-deployment smoke testing succeed.'''
          if old_remaining in text:
              text = text.replace(old_remaining, new_remaining, 1)
              record.write_text(text)
          PY
      - name: Remove temporary helper and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          test ! -f .github/workflows/vision-promotion-docs-once.yml || git rm .github/workflows/vision-promotion-docs-once.yml
          git add src/pages/RoadmapPage.tsx src/pages/ReleaseNotesPage.tsx docs/releases/VISION-REL-001-MERGE-READINESS.md
          if git diff --cached --quiet; then
            echo "Promotion records already closed."
          else
            git commit -m "docs(vision): close promotion readiness gates"
            git push origin HEAD:integration/vision-release-readiness
          fi

  validate:
    name: Full integration validation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          show-progress: false
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Validate NodeNext imports
        run: npm run validate:nodenext
      - name: Validate PM2B
        run: npm run validate:pm2b
      - name: Validate hero skills
        run: npm run validate:hero-skills
      - name: Validate hero skill governance
        run: npm run validate:hero-skills-governance
      - name: Validate editorial platform
        run: npm run validate:editorial-platform
      - name: Validate Verification Centre
        run: npm run validate:verification-centre
      - name: Validate Player Identity
        run: npm run validate:player-identity
      - name: Validate Art Studio
        run: npm run validate:art-studio
      - name: Test editorial API
        run: npm run test:editorial-api
      - name: Test Content Studio
        run: npm run test:content-studio
      - name: Test publication integrity
        run: npm run test:publication-integrity
      - name: Test Buildings publication
        run: npm run test:buildings-publication
      - name: Test Buildings progression ordering
        run: npm run test:buildings-progression-ordering
      - name: Test Verification Centre
        run: npm run test:verification-centre
      - name: Test hero skill governance
        run: npm run test:hero-skills-governance
      - name: Test Player Identity
        run: npm run test:player-identity
      - name: Test Art Studio
        run: npm run test:art-studio
      - name: Test Auto Redeem
        run: npm run test:auto-redeem
      - name: Test Render Engine
        run: npm run test:render-engine
      - name: Test Search
        run: npm run test:search
      - name: Test Search persistence
        run: npm run test:search-persistence
      - name: Test Search performance
        run: npm run test:search-performance
      - name: Test Search API
        run: npm run test:search-api
      - name: Test Search experience
        run: npm run test:search-experience
      - name: Test workspaces
        run: npm run test:workspaces
      - name: Test Forge identity
        run: npm run test:forge-identity
      - name: Test favourites
        run: npm run test:favourites
      - name: Test contributor applications
        run: npm run test:contributor-applications
      - name: Test UX-002 contracts
        run: npm run test:ux002-contracts
      - name: Test UX-003 contracts
        run: npm run test:ux003-contracts
      - name: Test RC4 security
        run: npm run test:rc4-security
      - name: Test Vision platform contracts
        run: node --import tsx scripts/test-forge-vision-platform.mjs
      - name: Test Vision worker
        run: node --import tsx scripts/test-forge-vision-worker.mjs
      - name: Test Vision authoring
        run: node --import tsx scripts/test-forge-vision-authoring.mjs
      - name: Test Vision authenticated acceptance contracts
        run: node scripts/test-forge-vision-authenticated-acceptance.mjs
      - name: Test Kingshot profile OCR
        run: npm run test:forge-vision-kingshot-profile
      - name: Test Vision account-linking page
        run: npm run test:forge-vision-account-linking-page
      - name: Test Vision evidence storage
        run: npm run test:forge-vision-evidence-storage
      - name: Test Vision permission transition
        run: node --import tsx scripts/test-forge-vision-permission-transition.mjs
      - name: Test Vision policy correction
        run: node scripts/test-forge-vision-policy-correction.mjs
      - name: Test Vision activation verifier
        run: node --import tsx scripts/test-forge-vision-activation-verifier.mjs
      - name: Test Vision activation preconditions
        run: node --import tsx scripts/test-forge-vision-activation-preconditions.mjs
      - name: Lint candidate
        run: npm run lint
      - name: Build candidate
        run: npm run build
      - name: Test rendering simulator
        run: node --import tsx scripts/test-render.mjs
      - name: Test rendering context calibration
        run: node --import tsx scripts/test-render-context-calibration.mjs
      - name: Test rendering core
        run: node --import tsx scripts/test-render-core.mjs
      - name: Test Kingshot screenshot calibration
        run: node --import tsx scripts/test-kingshot-screenshot-calibration.mjs
      - name: Test Kingshot visible-ink alignment
        run: node --import tsx scripts/test-kingshot-visible-ink-alignment.mjs
      - name: Run Art Studio acceptance harness
        run: npm run test:art-studio-acceptance
      - name: Run Art Studio provenance regression
        run: npm run test:art-studio-submit-provenance
